name: Build Q3 HE Firmware

on:
  push:
    branches:
      - patch-1
  workflow_dispatch:

jobs:
  build:
    name: Compile Q3 HE
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/qmk/qmk_cli

    env:
      SKIP_GIT: "yes"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compile firmware
        run: |
          qmk compile \
            -kb keychron/q3_he/ansi_encoder \
            -km default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: q3-he-firmware
          path: |
            *.bin
            *.hex
            *.uf2
          if-no-files-found: error
